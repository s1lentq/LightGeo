name: Build

on:
  push:
    branches: [ "master" ]
    tags: [ "*.*.*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-and-benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    outputs:
      data_ready: ${{ steps.fetcher.outputs.success }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DLIGHTGEO_BUILD_BENCHMARK=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j $(nproc)

      - name: Fetch Provider Data
        id: fetcher
        env:
          GEO_KEY: ${{ secrets.GEO_PROVIDER_KEY }}
          GEO_URL: ${{ secrets.GEO_PROVIDER_URL }}
        run: |
          if [ -z "$GEO_KEY" ] || [ -z "$GEO_URL" ]; then
            echo "::error::Provider secrets are not set! Skipping."
            exit 1
          fi

          download_and_check() {
            STATUS=$(curl -w "%{http_code}" -L "$1" -o "$2")
            if [ "$STATUS" -ne 200 ]; then
              echo "::warning::Download failed with status $STATUS. Skipping DB compilation."
              echo "Server response content:"
              cat "$2"
              return 1
            fi
            return 0
          }

          if download_and_check "${GEO_URL}?edition_id=GeoLite2-Country-CSV&license_key=${GEO_KEY}&suffix=zip" "csv.zip" && \
             download_and_check "${GEO_URL}?edition_id=GeoLite2-Country&license_key=${GEO_KEY}&suffix=tar.gz" "mmdb.tar.gz"; then
             echo "success=true" >> $GITHUB_OUTPUT
             unzip -q csv.zip
             find . -name "*Blocks-IPv4*.csv" -exec mv {} . \;
             find . -name "*Locations*.csv" -exec mv {} . \;
             tar -xzf mmdb.tar.gz
             find GeoLite2-Country_* -name "*.mmdb" -exec mv {} . \;
          else
             echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Compile LightGeo.db
        if: steps.fetcher.outputs.success == 'true'
        run: |
          PRIORITY_LANGS=("en" "ru" "es")
          LOC_ARGS=""
          for lang in "${PRIORITY_LANGS[@]}"; do
            FILE="GeoLite2-Country-Locations-${lang}.csv"
            if [ -f "$FILE" ]; then
              LOC_ARGS="$LOC_ARGS -l $FILE"
            fi
          done

          for file in *Locations*.csv; do
            if [[ "$LOC_ARGS" != *"$file"* ]]; then
              LOC_ARGS="$LOC_ARGS -l $file"
            fi
          done

          BLOCKS_FILE=$(ls *Blocks-IPv4*.csv | head -n 1)

          ./build/lightgeo \
            $LOC_ARGS \
            -b $BLOCKS_FILE \
            -p data/patches.txt \
            -o LightGeo.db

      - name: Run Unit Tests & Benchmark
        if: steps.fetcher.outputs.success == 'true'
        run: |
          MMDB_FILE=$(ls *.mmdb | head -n 1)
          ./build/lightgeo_bench LightGeo.db $MMDB_FILE

  release:
    name: Build Release Binaries
    needs: test-and-benchmark
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
            ext: tar.gz
            exe: lightgeo
          - os: windows-latest
            os_name: windows
            arch: x64
            ext: zip
            exe: Release/lightgeo.exe
    env:
      FOLDER: lightgeo-${{ matrix.os_name }}-${{ matrix.arch }}
      ASSET: lightgeo-${{ matrix.os_name }}-${{ matrix.arch }}.${{ matrix.ext }}

    steps:
      - name: Verify Release Integrity
        if: needs.test-and-benchmark.outputs.data_ready == 'false'
        run: |
          echo "::error::Release aborted: Unable to obtain or compile database."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DLIGHTGEO_BUILD_BENCHMARK=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build Compiler
        run: cmake --build build --config Release

      - name: Package Release (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p ${{ env.FOLDER }}/bin
          mkdir -p ${{ env.FOLDER }}/include
          cp build/${{ matrix.exe }} ${{ env.FOLDER }}/bin/
          cp include/lightgeo.hpp ${{ env.FOLDER }}/include/
          tar -czvf ${{ env.ASSET }} ${{ env.FOLDER }}/

      - name: Package Release (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ${{ env.FOLDER }}\bin
          New-Item -ItemType Directory -Force -Path ${{ env.FOLDER }}\include
          Copy-Item build\${{ matrix.exe }} -Destination ${{ env.FOLDER }}\bin\
          Copy-Item include\lightgeo.hpp -Destination ${{ env.FOLDER }}\include\
          Compress-Archive -Path ${{ env.FOLDER }} -DestinationPath ${{ env.ASSET }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
